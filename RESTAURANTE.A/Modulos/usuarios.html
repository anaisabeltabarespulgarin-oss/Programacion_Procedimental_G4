<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USUARIOS.</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  </head>
  <body>
      
    <h1 class="title is-1">Usuarios.</h1>

    <div class="box">
      <div class="field">
        <label class="label">Nombre:</label>
        <div class="control">
          <input
            class="input"
            type="nombre"
            placeholder="______________________________"
            id="nomusuu"
          />
        </div>
      </div>

      <div class="field">
        <label class="label">Apellidos: </label>
        <div class="control">
          <input class="input" type="apellidos" placeholder="______________________________  ______________________________" id="apel"/>
        </div>
      </div>
      <div class="field">
        <label class="label">Tipo de documento:</label>
        <div class="control">
          <input class="input" type="tipo_documento" placeholder="______________________________" id="tipdoc" />
        </div>
      </div>
      <div class="field">
        <label class="label">Número de documento:</label>
        <div class="control">
          <input class="input" type="numero_documento" placeholder="##########" id="docnuuum" />
        </div>
      </div>
      <div class="field">
        <label class="label">Telefono:</label>
        <div class="control">
          <input class="input" type="telefono" placeholder="##########" id="teler" />
        </div>
      </div>

      <div class="field">
        <label class="label">Correo Electronico: </label>
        <div class="control">
          <input class="input" type="correo_electronico" placeholder="ejem: luna19@gmail.com" id="c.e"/>
        </div>
      </div>
      <div class="field">
        <label class="label">Genero:</label>
        <div class="control">
          <input class="input" type="genero" placeholder="____________" id="gen" />
        </div>
      </div>
      <div class="field">
        <label class="label">Cargo:</label>
        <div class="control">
          <input class="input" type="cargo" placeholder="ejem: jefe,cajera,limpiadora,chef,etc..." id="car"/>
        </div>
      </div>
    
       
 
      <div class="field">
        <label class="label">Fecha de nacimiento: </label>
        <div class="control">
          <input class="input" type="fecha_nacimiento" placeholder="dd/mmm/aaaa" id="naci" />
        </div>
      </div>
      <div class="field">
        <label class="label">Contraseña:</label>
        <div class="control">
          <input class="input" type="contraseña" placeholder="*********" id="rase"/>
        </div>
      </div>


      <button class="button is-primary" id="guar">GUARDAR.</button>
      <a href="../index.html" class="button is-primary">INICIO.</a>
    </div>
    
    <script src="../js/usuarios.js"></script>
   
  </body>
</html>
