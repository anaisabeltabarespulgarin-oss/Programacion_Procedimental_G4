<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PEDIDOS.</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  </head>
  <body>
    <h1 class="title is-1">Pedidos.</h1>

    <div class="box">
       <div class="field">
        <label class="label">Código del Producto:</label>
        <div class="control">
          <input
            class="input"
            type="producto"
            placeholder="####"
            id="pcc"
          />
        </div>
      </div>


      <div class="field">
        <label class="label">Producto:</label>
        <div class="control">
          <input
            class="input"
            type="producto"
            placeholder="______________________________"
            id="nnp"
          />
        </div>
      </div>

      <div class="field">
        <label class="label">Dirección: </label>
        <div class="control">
          <input
            class="input"
            type="direccion"
            placeholder="ejem: calle 20 no.13-38 piso 3, el carmen"
            id="dip"
          />
        </div>
      </div>
      <div class="field">
        <label class="label">Nombre del usuario:</label>
        <div class="control">
          <input
            class="input"
            type="nombre_usuario"
            placeholder="______________________________  ______________________________  ______________________________"
            id="usun"
          />
        </div>
      </div>
      <div class="field">
        <label class="label">Cantidad:</label>
        <div class="control">
          <input class="input" type="cantidad" placeholder="###" id="dadrt" />
        </div>
      </div>
      <div class="field">
        <label class="label">Metodo de pago:</label>
        <div class="control">
          <input
            class="input"
            type="metodo_pago"
            placeholder="ejem: tarjeta de credito,nequi,efectivo,etc..."
            id="pagmet"
          />
        </div>
      </div>

      <div class="field">
        <label class="label">pago: </label>
        <div class="control">
          <input class="input" type="pago" placeholder="$____________" id="valpag"/>
        </div>
      </div>
      <div class="field">
        <label class="label">Telefono:</label>
        <div class="control">
          <input class="input" type="telefono" placeholder="##########" id="fono" />
        </div>
      </div>

      <button class="button is-primary" id="RDAR">GUARDAR.</button>
      <a href="../index.html" class="button is-primary">INICIO.</a>
    </div>
    <script src="../js/pedidos.js"></script>
  </body>
</html>
