<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Inventario</h1>

    <form>
      <label>Código del producto:</label>
      <input type="text" name="codigo_producto" />

      <br /><br />

      <label>Nombre del producto:</label>
      <input type="text" name="nombre_producto" />

      <br /><br />

      <label>Cantidad del producto:</label>
      <input type="number" name="cantidad_producto" />

      <br /><br />

      <label>Descripción del producto:</label>
      <input type="text" name="descripcion_producto" />

      <br /><br />

      <label>Marca del producto:</label>
      <input type="text" name="marca_producto" />

      <br /><br />

      <label>Valor unitario del producto:</label>
      <input type="number" name="valor_unitario" />

      <br /><br />

      <label>Categoria del producto:</label>
      <input type="text" name="categoria_producto" />

      <br /><br />

      <label>Ubicación del producto:</label>
      <input type="text" name="ubicacion_producto" />

      <br /><br />

      <button type="submit">Guardar</button>
    </form>
  </body>
</html>
