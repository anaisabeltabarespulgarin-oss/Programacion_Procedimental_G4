<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  </head>
  <body>
    <h1 class="title is-1">Inventario</h1>

    <form class="box">
      <div class="field">
        <label class="label">Código del producto:</label>
        <div class="control">
          <input
            class="input"
            type="codigo_producto"
            placeholder="###########"
          />
        </div>
      </div>

      <div class="field">
        <label class="label">Nombre del producto: </label>
        <div class="control">
          <input
            class="input"
            type="nombre_producto"
            placeholder="____________"
          />
        </div>
      </div>
      <div class="field">
        <label class="label">Cantidad del producto:</label>
        <div class="control">
          <input class="input" type="cantidad_producto" placeholder="###" />
        </div>
      </div>
      <div class="field">
        <label class="label">Descripcón del producto:</label>
        <div class="control">
          <input
            class="input"
            type="descripcion_producto"
            placeholder="______________________________"
          />
        </div>
      </div>
      <div class="field">
        <label class="label">Marca del producto:</label>
        <div class="control">
          <input
            class="input"
            type="marca_producto"
            placeholder="______________________________"
          />
        </div>
      </div>

      <div class="field">
        <label class="label">Valor unitario del producto: </label>
        <div class="control">
          <input
            class="input"
            type="valor_unitario"
            placeholder="$____________"
          />
        </div>
      </div>
      <div class="field">
        <label class="label">Categoria del producto:</label>
        <div class="control">
          <input
            class="input"
            type="categoria_producto"
            placeholder="____________"
          />
        </div>
      </div>
      <div class="field">
        <label class="label">Ubicación del producto:</label>
        <div class="control">
          <input
            class="input"
            type="ubicacion_producto"
            placeholder="ejem: pasillo 4, estante 3"
          />
        </div>
      </div>

      <button class="button is-primary">GUARDAR.</button>
    </form>
    
    <script src="../js/inventario.js"></script>

  </body>
</html>
